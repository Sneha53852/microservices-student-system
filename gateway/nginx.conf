events {
    worker_connections 1024;
}

http {
    upstream django_service {
        server django-service:8000;
    }

    upstream fastapi_service {
        server fastapi-service:8001;
    }

    server {
        listen 80;

        # Route /api/v1/django/ requests to Django DRF
        location /api/django/ {
            proxy_pass http://django_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route /api/v1/fast/ requests to FastAPI
        location /api/fast/ {
            proxy_pass http://fastapi_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}