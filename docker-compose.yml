services:
  fastapi-service:
    build: ./fast
    container_name: fastapi_service
    env_file:
      - .env
    expose:
      - "8001"
    networks:
      - micro_network

  django-service:
    build: ./python_project/myprofirst
    container_name: django_service
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - fastapi-service
    networks:
      - micro_network

  api-gateway:
    image: nginx:alpine
    container_name: api_gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - django-service
      - fastapi-service
    networks:
      - micro_network

networks:
  micro_network:
    driver: bridge